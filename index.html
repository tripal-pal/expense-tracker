<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense & Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
      <p>Manage your finances effectively</p>
    </header>

    <!-- Summary Section -->
    <section class="summary-cards">
      <div class="card balance">
        <h3>Current Balance</h3>
        <p id="total-balance">$0.00</p>
      </div>
      <div class="card income">
        <h3>Total Income</h3>
        <p id="total-income">$0.00</p>
      </div>
      <div class="card expense">
        <h3>Total Expenses</h3>
        <p id="total-expense">$0.00</p>
      </div>
    </section>

    <!-- Form Section -->
    <section class="form-container">
      <h2>Add New Transaction</h2>
      <div id="error-message" class="error-msg hidden"></div>
      <form id="transaction-form">
        <div class="form-group">
          <label for="text">Description</label>
          <input type="text" id="text" placeholder="e.g., Groceries, Salary..." autocomplete="off">
        </div>
        
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" step="0.01" placeholder="e.g., 50.00">
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type">
              <option value="income">Income</option>
              <option value="expense" selected>Expense</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="General">General</option>
              <option value="Food">Food</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Salary">Salary</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit">Add Transaction</button>
      </form>
    </section>

    <!-- Controls Section -->
    <section class="controls-container">
      <h2>History</h2>
      <div class="filter-box">
        <input type="text" id="search-input" placeholder="Search transactions...">
        <select id="filter-category">
          <option value="All">All Categories</option>
          <option value="General">General</option>
          <option value="Food">Food</option>
          <option value="Utilities">Utilities</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Salary">Salary</option>
        </select>
      </div>
    </section>

    <!-- Transaction List -->
    <section class="list-container">
      <ul id="transaction-list" class="transaction-list"></ul>
      <p id="empty-list-msg" class="empty-msg">No transactions found.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
